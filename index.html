<html lang="en">

<title>LH208L Cabin - Camera Placement</title>
<style>
:root{color-scheme:dark;--bg:#14161a;--panel:rgba(24,27,32,.9);--fg:#e8eaed;--mut:#9aa0a6;--acc:#2fbf8a;--line:#343a42;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#view{position:fixed;inset:0}
#view canvas{display:block}
#ui{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;width:min(250px,62vw);max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;z-index:5}
#ui h1{font-size:14px;margin:0 0 8px;color:#fff}
#ui label{display:block;margin:3px 0;color:var(--fg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
button{background:#232830;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 4px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
output{float:right;color:var(--acc)}
.lbl{background:#0b6b4a;color:#fff;font:600 11px system-ui,sans-serif;padding:2px 7px;border-radius:3px;white-space:nowrap;border:1px solid #2fe0a0}
.sec{color:var(--mut);font-size:11px;margin-top:8px;text-transform:uppercase;letter-spacing:.05em}
#ui h1{display:flex;justify-content:space-between;align-items:center;gap:10px}
#hd{margin:0;padding:5px 10px;font-size:12px;white-space:nowrap;flex:none}
.chk{display:flex;flex-wrap:wrap;gap:2px 14px}
#ui.closed{width:auto;padding:6px}
#ui.closed>:not(h1){display:none}
#ui.closed h1{margin:0}
#ui.closed h1 span{display:none}
@media (max-width:700px){
  #ui{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;right:10px;width:auto;max-height:42vh;padding:8px 10px}
  #ui.closed{right:auto}
  #ui h1{font-size:13px}
  button{padding:9px 6px}
  input[type=range]{height:28px}
  .lbl{font-size:10px;padding:1px 5px}
}
</style>

</div>

box(roof,.04,.04,W,GREY,-.3,H-.08,0); box(roof,.04,.04,W,GREY,.3,H-.08,0);
const vis=box(roof,L+.1,.03,.12,RED,0,H-.07,-.66); vis.rotation.x=.25;
for(const x of [-.6,-.3,.3,.6]) box(roof,.1,.06,.05,0xfff6d0,x,H,-.6,{emissive:0xfff0b0,emissiveIntensity:.7});
cyl(roof,.04,.07,0xff9900,-.6,H+.03,.3,{emissive:0xff8800,emissiveIntensity:.8});

box(roof,.05,.05,.07,DARK,0,H-.085,-.42); cyl(roof,.014,.02,0x0a0a0a,0,H-.085,-.465).rotation.x=Math.PI/2;
cyl(roof,.012,.2,DARK,.55,1.65,-.38);

box(cab,.02,.02,.95,0x777b82,-L/2+.03,.74,0); box(cab,.02,.02,.95,0x777b82,-L/2+.03,1.7,0);
cyl(cab,.014,.55,YEL,-.7,1.05,-.4); box(cab,.02,.02,.1,YEL,-.7,.8,-.45); box(cab,.02,.02,.1,YEL,-.7,1.3,-.45);
cyl(cab,.055,.32,0xd01c1c,-.35,.21,-.22); cyl(cab,.025,.06,0x111111,-.35,.4,-.22);
box(cab,1.04,.04,.1,DARK,0,.92,-.25);                               // instrument hood

// Contoured suspension seat
cyl(cab,.06,.3,DARK,0,.2,.3); box(cab,.5,.06,.46,0x1b1d20,0,.1,.3);
box(cab,.46,.1,.46,GREY,0,.45,.3,{roughness:.9});
for(const s of [-1,1]){box(cab,.05,.09,.4,DARK,s*.245,.5,.3);box(cab,.05,.45,.08,DARK,s*.235,.82,.5);}
const back=box(cab,.44,.62,.09,GREY,0,.82,.52,{roughness:.9}); back.rotation.x=-.1;
box(cab,.22,.14,.06,GREY,0,1.2,.56,{roughness:.9});
for(const s of [-1,1]){box(cab,.06,.05,.3,DARK,s*.28,.62,.3);box(cab,.03,.17,.04,DARK,s*.28,.53,.42);}

(function(){

glass=M(0x9bb7c4,.1,.1,{transparent:true,opacity:.3,side:T.DoubleSide}),led=M(0xffffee,0,.3,{emissive:0xffffcc,emissiveIntensity:1}),

const gc={};function rgeo(w,h,d){const k=[w,h,d].join(),r=Math.min(.06,Math.min(w,h,d)/3);if(gc[k])return gc[k];const g=new T.BoxGeometry(w,h,d,4,4,4),p=g.attributes.position,nm=g.attributes.normal,v=new T.Vector3(),c=new T.Vector3(),n=new T.Vector3(),hx=w/2-r,hy=h/2-r,hz=d/2-r;
for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.set(Math.max(-hx,Math.min(hx,v.x)),Math.max(-hy,Math.min(hy,v.y)),Math.max(-hz,Math.min(hz,v.z)));n.copy(v).sub(c);if(n.lengthSq()>1e-9){n.normalize();nm.setXYZ(i,n.x,n.y,n.z);n.multiplyScalar(r)}p.setXYZ(i,c.x+n.x,c.y+n.y,c.z+n.z)}return gc[k]=g}
function box(w,h,d,m,x,y,z,p){const o=new T.Mesh(rgeo(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o}

const root=new T.Group();root.name='LHD_Root';machine.add(root);
const R=.68,HX=.914,FA=.914; // tyre radius; hinge x on rear frame; front axle x in front-frame coords

cyl(.09,.8,steel,0,.65,0,art);cyl(.13,.05,steel,0,1.07,0,art);cyl(.13,.05,steel,0,.25,0,art);

// wheels: 4x 17.5-25 tyres

const rw=grp('Rear_Wheels','Two 17.5 × 25 34-ply L5S tyres on 14.00-25 rims, oscillating axle.',root),fw=grp('Front_Wheels','Two 17.5 × 25 34-ply L5S tyres. Track (centre to centre) about 1.89 m.',front);

const V=a=>new THREE.Vector3(...a);
function limb(a,b,r,c){                                              // capsule between two points
  const A=V(a),B=V(b),d=B.clone().sub(A),len=d.length();

function buildFov(c){                                              // rebuild translucent cone + dashed edges
  for(const o of [...c.fov.children]){c.fov.remove(o);o.geometry.dispose();o.material.dispose();}
  const h=c.len, r=h*Math.tan(THREE.MathUtils.degToRad(c.deg/2));
  const geo=new THREE.ConeGeometry(r,h,40,1,true); geo.translate(0,-h/2,0); geo.rotateX(-Math.PI/2); // apex at origin, opens along +Z
  c.fov.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x2fe0a0,transparent:true,opacity:.2,side:THREE.DoubleSide,depthWrite:false})));
  const pts=[];
  for(let k=0;k<8;k++){const a=k/8*Math.PI*2;pts.push(new THREE.Vector3(),new THREE.Vector3(r*Math.cos(a),r*Math.sin(a),h));}
  const lines=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineDashedMaterial({color:0x2fe0a0,dashSize:.05,gapSize:.035}));
  lines.computeLineDistances(); c.fov.add(lines);
}

let tw=null;
function goTo(name){
  const v=CONFIG.views[name];
  tw={t0:performance.now(),dur:900,p0:camera.position.clone(),q0:controls.target.clone(),
      p1:new THREE.Vector3(...v.p),q1:new THREE.Vector3(...v.t)};
  if(name==='top') setCheck('tRoof',false);                        // roof would hide the top view
  if(name==='reset') Object.keys(toggles).forEach(k=>setCheck(k,true));
}
document.querySelectorAll('button[data-v]').forEach(b=>b.addEventListener('click',()=>goTo(b.dataset.v)));

/* ---------- Loop + resize ---------- */
function resize(){
  const w=host.clientWidth,h=host.clientHeight;
  renderer.setSize(w,h); labelRenderer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
(function loop(){
  requestAnimationFrame(loop);
  if(tw){
    const k=Math.min(1,(performance.now()-tw.t0)/tw.dur), e=ease(k);
    camera.position.lerpVectors(tw.p0,tw.p1,e); controls.target.lerpVectors(tw.q0,tw.q1,e);
    if(k>=1) tw=null;
  }
  controls.update();
  renderer.render(scene,camera); labelRenderer.render(scene,camera);
})();
